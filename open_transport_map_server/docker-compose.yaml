services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: open_transport_map
      POSTGRES_PASSWORD: "baxXpyhgpJC4kYHTcxlVixN0C_kUyFmM"
    volumes:
      - open_transport_map_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "RP84NbmmyFXdcAq4OuPrY6BLqA9uREeJ"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: open_transport_map_test
      POSTGRES_PASSWORD: "nIvrT77qF5xZlWjMoKSiVjMGGXJ697-g"
    volumes:
      - open_transport_map_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "WKaPUuXIMZljVsH8C7SAmyfJh0JtoX1Y"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  open_transport_map_data:
  open_transport_map_test_data:
